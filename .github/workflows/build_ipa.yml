name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flet
        run: pip install "flet[all]"

      - name: Build Unsigned IPA
        run: |
          flet build ipa --no-codesign --info-plist NSPhotoLibraryUsageDescription="Cho phép chọn ảnh body để lưu lịch sử thể trạng" || true
          APP_PATH=$(find build -name "*.app" 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find / -name "Runner.app" 2>/dev/null | head -n 1)
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry FitnessApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitnessApp-iOS
          path: FitnessApp.ipa
