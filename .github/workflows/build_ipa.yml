name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Install Flet
        run: |
          echo "flet==0.24.1" > requirements.txt
          pip install "flet[all]==0.24.1"

      - name: Build Unsigned IPA
        run: |
          REAL_FLUTTER=$(which flutter)
          mkdir -p "$HOME/flutter-wrapper"
          cat << 'EOF' > "$HOME/flutter-wrapper/flutter"
          #!/bin/bash
          if [ "$1" = "build" ] && [ "$2" = "ipa" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Cho phep chon anh body'" ios/Runner/Info.plist 2>/dev/null || true
            "REAL_FLUTTER_PATH" build ios --release --no-codesign
            mkdir -p build/ios/ipa Payload
            cp -R build/ios/iphoneos/Runner.app Payload/
            zip -qry build/ios/ipa/FitnessApp.ipa Payload
            cp build/ios/ipa/FitnessApp.ipa "$GITHUB_WORKSPACE/FitnessApp.ipa"
            exit 0
          else
            exec "REAL_FLUTTER_PATH" "$@"
          fi
          EOF
          sed -i '' "s|REAL_FLUTTER_PATH|$REAL_FLUTTER|g" "$HOME/flutter-wrapper/flutter"
          chmod +x "$HOME/flutter-wrapper/flutter"
          export PATH="$HOME/flutter-wrapper:$PATH"
          flet build ipa -v

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FitnessApp-iOS
          path: FitnessApp.ipa
